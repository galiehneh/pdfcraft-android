    <title>PdfCraft</title>
    
<script type="module">
import init, * as bindings from './pdfcraft-web-fd49b70a2ecf438.js';
const wasm = await init({ module_or_path: './pdfcraft-web-fd49b70a2ecf438_bg.wasm' });

window.wasmBindings = bindings;

dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
</script>
<script>
(function() {
  const origClick = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function() {
    if (this.href && this.href.startsWith("blob:") && window.PdfCraftAndroid) {
      const href = this.href;
      const filename = this.download || "document.pdf";
      fetch(href)
        .then(function(res) { return res.blob(); })
        .then(function(blob) {
          const reader = new FileReader();
          reader.onloadend = function() {
            if (window.PdfCraftAndroid && window.PdfCraftAndroid.saveBlob) {
              window.PdfCraftAndroid.saveBlob(reader.result, filename);
            }
          };
          reader.readAsDataURL(blob);
        })
        .catch(function(err) {
          console.error("Blob download interception error:", err);
        });
    }
    return origClick.apply(this, arguments);
  };

  window.handleAndroidBack = function() {
    const ev = new KeyboardEvent('keydown', {
      key: 'Escape',
      code: 'Escape',
      keyCode: 27,
      which: 27,
      bubbles: true
    });
    window.dispatchEvent(ev);
    document.dispatchEvent(ev);
  };
})();
</script>
