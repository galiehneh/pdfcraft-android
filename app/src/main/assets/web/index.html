<html lang="en">

    <meta charset="utf-8" />

    <title>PdfCraft</title>
    
<script type="module">
import init, * as bindings from './pdfcraft-web-237d17fe2e614db2.js';
const wasm = await init({ module_or_path: './pdfcraft-web-237d17fe2e614db2_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
<script>
(function() {
  const origClick = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function() {
    if (this.href && this.href.startsWith("blob:") && window.PdfCraftAndroid) {
      const href = this.href;
      const filename = this.download || "document.pdf";
      fetch(href)
        .then(function(res) { return res.blob(); })
        .then(function(blob) {
          const reader = new FileReader();
          reader.onloadend = function() {
            if (window.PdfCraftAndroid && window.PdfCraftAndroid.saveBlob) {
              window.PdfCraftAndroid.saveBlob(reader.result, filename);
            }
          };
          reader.readAsDataURL(blob);
        })
        .catch(function(err) {
          console.error("Blob download interception error:", err);
        });
    }
    return origClick.apply(this, arguments);
  };
})();
</script>
